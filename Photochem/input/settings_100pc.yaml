atmosphere-grid:
  bottom: 0.0 # cm
  top: 1.0e7 # cm
  number-of-layers: 100

planet:
  planet-mass: 5.972e27 # grams
  planet-radius: 6.371e8 # cm. Radius to bottom of atmosphere-grid
  surface-albedo: 0.2 # cm 
  # photon-scale-factor: 1.0 # Optional. Scales the stellar flux for diff planets in the same system
  solar-zenith-angle: 60.0 # degrees
  hydrogen-escape:
    type: diffusion limited # options are "diffusion limited", "zahnle" and "none"
    # S1: 20 # required for type zahnle

  water:
    # will fix water in the troposphere to a relative humidity between the surface
    # and `tropopause-altitude`.
    fix-water-in-troposphere: false 
    # Options are a number like 1.0, or "manabe", which is the Mamabe-Wetherald 
    # parameterization for Earth's troposphere relative humidity
    #relative-humidity: manabe
    # If "true", then gases will dissolve in rainwater and fall to the surface
    gas-rainout: true
    rainfall-rate: 1 # relative to modern earth's rainfall rate
    # You can specify rainout species. If omitted, then model will use all species with data.
    # rainout-species: [H2SO4aer] 
    tropopause-altitude: 1.1e6 # cm. required if gas-rainout or fix-water-in-troposphere
    # If true, then water will condense.
    water-condensation: false

particles:
- {name: H2Oaer, RH-condensation: 0.4}
    
# Specifies boundary conditions. If a species is not specified, then
# the model assumes zero-flux boundary conditions at the top and
# bottom of the atmosphere
# pressure boundary conditions units of dynes/cm^2. press ≈ partial pressure in µbar ≈ mixing ratio in ppmv × 10⁶

boundary-conditions:
- name: H2O
  lower-boundary: {type: press, press: 270.0e6} #pressure boundary conditions in dynes / cm2. 270 bar H2O is 1 ocean)
  upper-boundary: {type: veff, veff: 0.0}

#waccm6
- name: N2
  lower-boundary: {type: press, press: 7.90140e+05}
  upper-boundary: {type: veff, veff: 0.0}
- name: O2
  lower-boundary: {type: press, press: 2.12730e+05}
  upper-boundary: {type: veff, veff: 0.0}
- name: CH4
  lower-boundary: {type: press, press: 0.808}
  upper-boundary: {type: veff, veff: 0.0}
- name: H2
  lower-boundary: {type: press, press: 0.5}
  upper-boundary: {type: veff, veff: 0.0}
- name: CO2
  lower-boundary: {type: press, press: 284.0}
  upper-boundary: {type: veff, veff: 0.0}
- name: N2O
  lower-boundary: {type: press, press: 0.273}
  upper-boundary: {type: veff, veff: 0.0}
- name: OCS
  lower-boundary: {type: press, press: 3.37e-4}
  upper-boundary: {type: veff, veff: 0.0}
- name: SO2
  lower-boundary: {type: vdep + dist flux, vdep: 1, flux: 1.43e9, height: 1.9}
  upper-boundary: {type: veff, veff: 0.0}

- name: H2CO
  lower-boundary: {type: flux, flux: 5.16e8}
  upper-boundary: {type: veff, veff: 0.0}
#cesm anther + biomass burning

#wogan defaults

- name: CO
  lower-boundary: {type: vdep + dist flux, vdep: 0.03, flux: 4.98e10, height: -1.0}
  upper-boundary: {type: veff, veff: 0.0}
# vdep: Hauglustaine et al. (1994)
# flux: cesm biomass burning + anthropogenic + oceans

- name: "NO"
  lower-boundary: {type: vdep + dist flux, vdep: 0.01, flux: 2.37e9, height: -1.0}
  upper-boundary: {type: veff, veff: 0.0}
# vdep: Hauglustaine et al. (1994)
# flux: cesm for anthropogenic + soils + biomass burning

- name: NH3
  lower-boundary: {type: vdep + dist flux, vdep: 1, flux: 1.5e10, height: -1.0}
  upper-boundary: {type: veff, veff: 0.0}
# Changed compared to Tsai et al. (2021)
# vdep: Hauglustaine et al. (1994)

- name: NO2
  lower-boundary: {type: vdep, vdep: 0.05}
  upper-boundary: {type: veff, veff: 0.0}
# Changed compared to Tsai et al. (2021)
# vdep: Hauglustaine et al. (1994)

- name: NO3
  lower-boundary: {type: vdep, vdep: 0.05}
  upper-boundary: {type: veff, veff: 0.0}
# vdep: Seinfeld and Pandis (2016)
# flux: Seinfeld and Pandis (2016)

- name: H2S
  lower-boundary: {type: vdep + dist flux, vdep: 0.015, flux: 2e8, height: -1.0}
  upper-boundary: {type: veff, veff: 0.0}
# vdep: Tsai et al. (2021)
# flux: Seinfeld and Pandis (2016)

- name: H2SO4
  lower-boundary: {type: vdep + dist flux, vdep: 1, flux: 7e8, height: -1.0}
  upper-boundary: {type: veff, veff: 0.0}
# vdep: Tsai et al. (2021)
# flux: Li et al. (2003)

- name: HCN
  lower-boundary: {type: vdep + dist flux, vdep: 0.13, flux: 1.7e8, height: -1.0}
  upper-boundary: {type: veff, veff: 0.0}
# vdep: Tsai et al. (2021)
# flux: Li et al. (2003)

- name: CH3CN
  lower-boundary: {type: vdep + dist flux, vdep: 0.13, flux: 1.3e8, height: -1.0}
  upper-boundary: {type: veff, veff: 0.0}
# vdep: Tsai et al. (2021)

- name: HNO3
  lower-boundary: {type: vdep, vdep: 4}
  upper-boundary: {type: veff, veff: 0.0}

